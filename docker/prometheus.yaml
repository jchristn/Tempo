# Prometheus scrape configuration for the Tempo stack.
#
# Tempo processes push metrics over OTLP to the collector, which exposes them on :8889.
# honor_labels keeps the job (service name) and instance (service instance id) labels the
# collector derives from each process's resource, instead of overwriting them with this job.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'otel-collector'
    honor_labels: true
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['127.0.0.1:9090']

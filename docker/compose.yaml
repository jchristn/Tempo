x-tempo-worker-env: &tempo-worker-env
  TEMPO_WORKER_SETTINGS_FILE: /var/lib/tempo-worker/config/tempo.worker.json
  TEMPO_WORKER_SERVER_ENDPOINT: ${TEMPO_WORKER_SERVER_ENDPOINT:-http://tempo-server:8901}
  TEMPO_WORKER_BOOTSTRAP_ADMIN_API_KEY: ${TEMPO_WORKER_BOOTSTRAP_ADMIN_API_KEY:-tempo-local-admin-api-key}

x-tempo-server-env: &tempo-server-env
  TEMPO_AUTH_ADMIN_API_KEY: ${TEMPO_WORKER_BOOTSTRAP_ADMIN_API_KEY:-tempo-local-admin-api-key}
  TEMPO_LOG_VIEWER_WORKER_ROOT: /var/lib/tempo-server/worker-logs

x-tempo-mcp-env: &tempo-mcp-env
  TEMPO_ENDPOINT: http://tempo-server:8901
  TEMPO_MCP_HTTP_HOSTNAME: "*"
  TEMPO_MCP_TCP_ADDRESS: 0.0.0.0
  TEMPO_MCP_WS_HOSTNAME: "*"

x-tempo-worker: &tempo-worker
  image: jchristn77/tempo-worker:v0.3.0
  restart: unless-stopped
  depends_on:
    tempo-server:
      condition: service_healthy
  volumes:
    - ./tempo.worker.json:/var/lib/tempo-worker/config/tempo.worker.json:ro
    - tempo_worker_logs:/var/lib/tempo-worker/logs
    - /var/lib/tempo-worker/runtime-cache
    - /var/lib/tempo-worker/scratch

services:
  tempo-server:
    image: jchristn77/tempo-server:v0.3.0
    restart: unless-stopped
    environment:
      <<: *tempo-server-env
    ports:
      - "8901:8901"
    volumes:
      - ./tempo.server.json:/var/lib/tempo-server/config/tempo.json:ro
      - tempo_server_db:/var/lib/tempo-server/db
      - tempo_server_artifacts:/var/lib/tempo-server/artifacts
      - tempo_server_logs:/var/lib/tempo-server/logs
      - tempo_worker_logs:/var/lib/tempo-server/worker-logs:ro
      - tempo_server_runtime_cache:/var/lib/tempo-server/runtime-cache
      - tempo_server_scratch:/var/lib/tempo-server/scratch
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8901/v1.0/api/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 2

  tempo-worker-1:
    <<: *tempo-worker
    environment:
      <<: *tempo-worker-env
      TEMPO_WORKER_ID: wrk_docker_1
      TEMPO_WORKER_NAME: tempo-worker-1
      TEMPO_WORKER_LOG_DIRECTORY: /var/lib/tempo-worker/logs/wrk_docker_1

  tempo-worker-2:
    <<: *tempo-worker
    environment:
      <<: *tempo-worker-env
      TEMPO_WORKER_ID: wrk_docker_2
      TEMPO_WORKER_NAME: tempo-worker-2
      TEMPO_WORKER_LOG_DIRECTORY: /var/lib/tempo-worker/logs/wrk_docker_2

  tempo-worker-3:
    <<: *tempo-worker
    environment:
      <<: *tempo-worker-env
      TEMPO_WORKER_ID: wrk_docker_3
      TEMPO_WORKER_NAME: tempo-worker-3
      TEMPO_WORKER_LOG_DIRECTORY: /var/lib/tempo-worker/logs/wrk_docker_3

  dashboard:
    image: jchristn77/tempo-ui:v0.3.0
    restart: unless-stopped
    depends_on:
      tempo-server:
        condition: service_healthy
    ports:
      - "3000:80"
    volumes:
      - dashboard_logs:/var/log/nginx
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 2

  tempo-mcp:
    image: jchristn77/tempo-mcp:v0.3.0
    restart: unless-stopped
    depends_on:
      tempo-server:
        condition: service_healthy
    environment:
      <<: *tempo-mcp-env
    ports:
      - "8910:8910"
      - "8911:8911"
      - "8912:8912"
    volumes:
      - tempo_mcp_config:/var/lib/tempo-mcp/config
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/8910' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 2

volumes:
  tempo_server_db:
  tempo_server_artifacts:
  tempo_server_logs:
  tempo_worker_logs:
  tempo_server_runtime_cache:
  tempo_server_scratch:
  dashboard_logs:
  tempo_mcp_config:
